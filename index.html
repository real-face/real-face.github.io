<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REAL FACE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F4F7; --paper:#FFFFFF; --ink:#181B2E; --sub:#646A80; --line:#DADDE6; --tray:#181B2E; --tile:#262A42;
  --y:#F2C230; --b:#2F6FD8; --g:#2FB36A; --p:#8A5BD6; --o:#F07A2A;
  --c:var(--ink);
  --vh:100vh;
}
@supports (height:100dvh){ :root{ --vh:100dvh } }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#0F1220; --paper:#191D30; --ink:#F1F2F6; --sub:#9AA0B8; --line:#2C3149; --tray:#232842; --tile:#30365A; }
}
:root[data-theme="dark"]{ --bg:#0F1220; --paper:#191D30; --ink:#F1F2F6; --sub:#9AA0B8; --line:#2C3149; --tray:#232842; --tile:#30365A; }
*,*::before,*::after{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  font-weight:500; line-height:1.75; -webkit-tap-highlight-color:transparent;
}
/* どの画面も1画面に収める（スクロールなし） */
main{
  max-width:520px; margin:0 auto; height:var(--vh); display:flex; flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(12px + env(safe-area-inset-bottom,0px));
}
.screen{display:none}
.screen.on{display:flex; flex-direction:column; flex:1; min-height:0; gap:10px}
.en{font-family:"Unbounded","Futura","Avenir Next",sans-serif}
p{margin:0}
.muted{color:var(--sub); font-size:.84rem; line-height:1.6}

/* ---------- top ---------- */
#s-start{justify-content:safe center; gap:0}
.logo{font-family:"Unbounded","Futura","Avenir Next",sans-serif; font-weight:800; font-size:clamp(2.6rem,min(19vw,10.5dvh),5.4rem); line-height:.88; letter-spacing:-.045em; margin:0}
.logo .w{display:block; position:relative; width:max-content}
.logo .w i{position:absolute; left:.045em; top:.05em; font-style:normal; color:var(--ink)}
.logo .w b{position:relative; font-weight:inherit; background:linear-gradient(to bottom,#FFD524 0%,#FFAE1A 50%,#F2621C 100%); -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent}
.logo .w+.w{margin-left:auto; margin-right:.05em}   /* REAL は左、FACE は右に寄せて対角にバランスを取る */
.logo small{display:block; font-family:"Unbounded",sans-serif; font-weight:500; font-size:.72rem; letter-spacing:.32em; color:var(--sub); margin:14px .1em 0 0; text-align:right}
.stripe{display:flex; flex:none; height:10px; margin:16px 0; border-radius:6px; overflow:hidden}
.stripe i{flex:1}
.tag{font-size:1.08rem; font-weight:700; line-height:1.6; margin-bottom:6px}
.sec{display:flex; justify-content:space-between; align-items:center; margin:22px 0 10px}
.sec h2{font-size:1rem; margin:0; font-weight:900}
/* 写真のバージョン（通常ver.／衣装ver.）の切り替え。同じページのまま画像データを入れ替える */
.vsel{display:flex; gap:4px; background:var(--paper); border:2px solid var(--ink); border-radius:999px; padding:3px; margin-top:14px; box-shadow:2px 2px 0 var(--ink)}
.vsel button{flex:1; font:inherit; font-weight:700; font-size:.95rem; color:var(--ink); background:transparent; border:none; border-radius:999px; padding:5px 4px; line-height:1.4; cursor:pointer}
.vsel button[aria-checked="true"]{background:var(--ink); color:var(--bg)}
.levels{display:flex; flex-direction:column; gap:12px}
/* ステッカー風のボタン（ロゴと同じ濃紺の影）。押すと影の分だけ沈む */
.lvbtn{
  --lc:var(--o);
  display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%;
  border:2.5px solid var(--ink); border-left-width:12px; border-left-color:var(--lc); border-radius:18px;
  background:var(--paper); color:var(--ink); padding:10px 14px 10px 16px;
  font:inherit; text-align:left; cursor:pointer; min-height:62px;
  box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s;
}
.lvbtn:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink)}
.lvbtn[data-lv=easy]{--lc:var(--g)} .lvbtn[data-lv=hard]{--lc:var(--o)} .lvbtn[data-lv=rot]{--lc:var(--p)}
.lvbtn b{font-size:1.2rem; font-weight:900; line-height:1.3}
.lvbtn small{display:block; font-size:.9rem; color:var(--sub); font-weight:500; line-height:1.4}
.lvbtn .go{flex:none; display:grid; place-items:center; width:38px; height:38px; border-radius:50%; background:var(--lc); color:#fff; font-size:1rem; line-height:1}
.tag b{color:var(--o)}
@media (max-height:620px){ .logo{font-size:min(19vw,9dvh)} .logo small{margin-top:8px} .stripe{margin:10px 0} .sec{margin-top:10px} .vsel{margin-top:10px} .vsel button{padding:3px 4px} .lvbtn{min-height:52px; padding:6px 12px 6px 14px} .lvbtn .go{width:32px; height:32px} }

/* ---------- member select ---------- */
.head{display:flex; align-items:center; gap:10px; flex:none}
.head h2{font-size:1.1rem; font-weight:900; margin:0; flex:1}
.back{
  flex:none; width:44px; height:44px; border-radius:50%; border:2px solid var(--line); background:var(--paper);
  color:var(--ink); font:inherit; font-size:1.3rem; font-weight:900; line-height:1; cursor:pointer;
}
.lvtag{font-size:.8rem; font-weight:700; background:var(--ink); color:var(--bg); border-radius:999px; padding:4px 12px}
.people{display:flex; flex-direction:column; gap:8px; flex:1; min-height:0}
.who{
  flex:1 1 0; min-height:0; max-height:104px;
  display:flex; align-items:center; gap:12px;
  border:none; padding:6px 18px 6px 6px; background:var(--paper); border-radius:20px; cursor:pointer;
  font:inherit; color:var(--ink); text-align:left; position:relative; overflow:hidden;
}
.who::after{content:""; position:absolute; right:0; top:0; bottom:0; width:8px; background:var(--c)}
.who img{height:100%; max-height:92px; aspect-ratio:1; flex:none; border-radius:14px; object-fit:cover; object-position:50% 40%; background:var(--c)}
.who > span:first-of-type{flex:1}
.who .nm{font-size:1.3rem; font-weight:900; line-height:1.2; display:block}
.subbar{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:none}
.bestbtn{font:inherit; font-size:.9rem; font-weight:700; color:var(--ink); background:var(--paper); border:2px solid var(--ink); border-radius:999px; padding:5px 14px; cursor:pointer; box-shadow:2px 2px 0 var(--ink); line-height:1.4}
.bestbtn:active{transform:translate(2px,2px); box-shadow:none}
/* 最高記録のダイアログ：レベルを切り替えて5人分の最高点を見る */
.modal{position:fixed; inset:0; z-index:200000; display:none; align-items:center; justify-content:center; padding:16px; background:rgba(10,12,24,.55)}
.modal.on{display:flex}
.modal .card{width:100%; max-width:440px; max-height:100%; overflow:auto; background:var(--paper); color:var(--ink); border-radius:22px; padding:16px; box-shadow:0 10px 40px rgba(0,0,0,.35)}
.modal .mh{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.modal .mh h3{margin:0; font-size:1.15rem; font-weight:900}
.modal .x{width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:1.1rem; font-weight:900; cursor:pointer; line-height:1}
.bl-tabs{display:flex; gap:4px; background:var(--bg); border-radius:999px; padding:3px; margin-bottom:10px}
.bl-tabs button{flex:1; font:inherit; font-weight:700; border:none; background:transparent; color:var(--ink); border-radius:999px; padding:6px 4px; cursor:pointer}
.bl-tabs button[aria-selected="true"]{background:var(--ink); color:var(--bg)}
.bl-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.bl-list li{display:flex; align-items:center; gap:12px; padding:6px 12px 6px 6px; border-radius:14px; background:var(--bg); border-left:6px solid var(--c)}
.bl-list img{width:44px; height:44px; border-radius:10px; object-fit:cover; object-position:50% 40%; flex:none}
.bl-list .n{flex:1; font-weight:900; font-size:1.05rem}
.bl-list .v{font-family:"Unbounded",sans-serif; font-weight:700; font-size:1.15rem}
.bl-list .v small{font-family:"Zen Kaku Gothic New",sans-serif; font-size:.8rem; margin-left:2px}
.bl-list .none{font-weight:700; color:var(--sub)}
.bl-note{font-size:.76rem; color:var(--sub); margin-top:10px}

.who .go{flex:none; display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--c); color:#fff; font-size:.85rem; line-height:1}
.loading{color:var(--sub)}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:48px; padding:8px 18px; border-radius:999px;
  font:inherit; font-weight:700; font-size:.98rem; cursor:pointer;
  border:2px solid var(--line); background:var(--paper); color:var(--ink); white-space:nowrap;
}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.btn:disabled{opacity:.35; cursor:not-allowed}
.btn.sm{min-height:42px; padding:6px 14px; font-size:.9rem}
.btn:focus-visible,.lvbtn:focus-visible,.back:focus-visible,.seg input:focus-visible+span,.who:focus-visible,.pal button:focus-visible,.tabs button:focus-visible,.tools button:focus-visible{outline:3px solid var(--c); outline-offset:2px}
.row{display:flex; gap:10px; flex:none}
.row .btn{flex:1 1 0; padding-inline:10px}

/* ---------- play ---------- */
.hud{display:flex; justify-content:space-between; align-items:center; gap:8px; flex:none}
.hud > div:first-child{min-width:0}
.pill{display:flex; align-items:center; gap:8px; font-weight:900; font-size:1.05rem; line-height:1.3}
.pill i{width:12px; height:12px; flex:none; border-radius:50%; background:var(--c)}
.need{font-size:.76rem; color:var(--sub); font-weight:500; line-height:1.4}
.time{font-family:"Unbounded",sans-serif; font-weight:500; font-variant-numeric:tabular-nums; font-size:.82rem; color:var(--sub)}
.acts{display:flex; gap:6px; flex:none}
.stagebox{flex:1; min-height:0; container-type:size; display:flex; align-items:center; justify-content:center}
#stage{position:relative; width:min(100cqw - 8px,100cqh - 8px); aspect-ratio:1; border-radius:24px; overflow:hidden; background:var(--line); touch-action:none; box-shadow:0 0 0 4px var(--c)}
#board{position:absolute; inset:0; width:100%; height:100%}
.piece{position:absolute; touch-action:none; cursor:grab; user-select:none; -webkit-user-drag:none}
/* 長押しで出る「画像をコピー/保存」のメニューと文字選択を、パーツ合わせの画面では出さない */
#s-play{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none}
#s-play img{-webkit-user-drag:none}
.piece.sel{filter:drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 3px var(--c))}
.piece.drag{cursor:grabbing}
#stage.peek .piece.sel{filter:none}
.piece{transform-origin:50% 50%}
/* 激ムズ：選択中のパーツの回転つまみ（中心とつまみを線で結ぶ） */
#rotH{position:absolute; left:0; top:0; width:0; height:0; z-index:100000; display:none; pointer-events:none}
#rotH.on{display:block}
#rotH i{position:absolute; left:0; top:0; height:2px; background:#fff; transform-origin:0 50%; box-shadow:0 0 2px rgba(0,0,0,.5)}
#rotH b{position:absolute; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:var(--c); border:3px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.4); pointer-events:auto; touch-action:none; cursor:grab; display:grid; place-items:center; color:#fff; font-size:15px; line-height:1}
#stage.peek #rotH{display:none}
.pal button img.lv{transform:rotate(var(--r)) scale(.86)}
.tray{--th:clamp(40px,7dvh,60px); flex:none; background:var(--tray); border-radius:22px; padding:8px; color:#F1F2F6}
.tabs{display:flex; gap:4px; background:rgba(255,255,255,.08); border-radius:999px; padding:3px; margin-bottom:8px}
.tabs button{flex:1; font:inherit; font-weight:700; padding:5px 4px; border-radius:999px; cursor:pointer; border:none; background:transparent; color:#F1F2F6; line-height:1.5}
.tabs button[aria-selected="true"]{background:#F1F2F6; color:#181B2E}
.tabs b{font-family:"Unbounded",sans-serif; font-weight:500; font-size:.72rem; margin-left:4px; opacity:.7}
/* 目は最大2段。タブを切り替えても高さが変わらないよう2段分を確保する */
.pal{display:grid; grid-template-columns:repeat(5,1fr); grid-auto-rows:var(--th); gap:6px; min-height:calc(var(--th) * 2 + 6px); align-content:start}
.pal button{border:none; background:var(--tile); border-radius:12px; padding:4px; cursor:pointer; display:flex; align-items:center; justify-content:center; min-width:0}
.pal button img{max-width:100%; max-height:100%; display:block}
.pal button.used{opacity:.25}
.tools{display:flex; gap:6px; margin-top:8px}
.tools button{flex:1; font:inherit; font-size:.78rem; font-weight:700; color:#F1F2F6; background:transparent; border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:7px 4px; cursor:pointer; line-height:1.4; white-space:nowrap}
.tools button:disabled{opacity:.3; cursor:not-allowed}
.tools .peek{flex:1.5; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:none}
.tools .peek.on{background:#F1F2F6; color:#181B2E}

/* ---------- result ---------- */
.res{flex:none; background:var(--paper); border-radius:22px; padding:14px 18px 12px; position:relative; overflow:hidden}
.res::before{content:""; position:absolute; left:0; top:0; right:0; height:6px; background:var(--c)}
.res-top{display:flex; justify-content:space-between; align-items:flex-end; gap:10px}
.score{display:flex; align-items:baseline; gap:4px; flex:none}
.score .big{font-family:"Unbounded",sans-serif; font-weight:800; font-size:clamp(2.4rem,7dvh,3.6rem); line-height:1; letter-spacing:-.04em; font-variant-numeric:tabular-nums}
.score .pt{font-weight:700}
.rank{font-size:1.1rem; font-weight:900; line-height:1.4; margin-top:2px}
.quote{margin:6px 0 0; padding:4px 10px; border-left:4px solid var(--qc); background:var(--bg); border-radius:0 10px 10px 0; font-size:.78rem; font-weight:700; line-height:1.45}
.quote small{font-size:.68rem; font-weight:500; color:var(--sub); margin-left:4px; white-space:nowrap}
.res .muted{line-height:1.45}
@container (max-height:210px){ .cap{display:none} }
.bars .sd{display:none}
/* 背の低い画面（iPhone SE など）：すき間を詰め、パーツの持ち主は色の点だけにする */
@media (max-height:620px){
  #s-result{gap:6px}
  .res{padding:10px 14px 8px}
  .sub{margin:4px 0 0}
  .bars{gap:2px 14px}
  .bars .who2{display:none}
  .bars .sd{display:inline-block}
  #s-result .btn{min-height:42px}
}
.sub{display:flex; gap:18px; margin:8px 0 2px}
.sub div{font-size:.74rem; color:var(--sub); display:flex; align-items:baseline; gap:6px}
.sub b{font-family:"Unbounded",sans-serif; font-weight:500; font-size:.98rem; color:var(--ink); font-variant-numeric:tabular-nums}
#resMeta{font-size:.76rem}
.best{font-weight:700}
.seg{display:flex; flex:none; background:var(--paper); border-radius:999px; padding:4px; gap:4px}
.seg label{flex:1; position:relative}
.seg input{position:absolute; opacity:0}
.seg span{display:block; text-align:center; padding:6px; border-radius:999px; font-weight:700; font-size:.88rem; cursor:pointer; line-height:1.4}
.seg input:checked+span{background:var(--ink); color:var(--bg)}
.imgbox{flex:1; min-height:0; container-type:size; display:flex; align-items:center; justify-content:center}
.imgwrap{position:relative; width:min(100cqw,100cqh); aspect-ratio:1}
#resultImg{display:block; width:100%; height:100%; border-radius:22px}
.cap{position:absolute; left:8px; right:8px; bottom:8px; font-size:.7rem; line-height:1.4; color:#fff; background:rgba(16,18,32,.6); border-radius:10px; padding:4px 8px; text-align:center}
.bars{list-style:none; padding:0; margin:0; flex:none; display:grid; grid-template-columns:1fr 1fr; gap:6px 14px}
.bars li{display:grid; grid-template-columns:auto 1fr auto; align-items:center; column-gap:8px; font-size:.8rem; font-weight:700; line-height:1.4}
.bars .who2{grid-column:1 / 4; font-size:.68rem; color:var(--sub); font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bars .bar{height:6px; background:var(--line); border-radius:6px; overflow:hidden}
.bars .bar i{display:block; height:100%; background:var(--c)}
.bars .v{text-align:right; font-family:"Unbounded",sans-serif; font-weight:500; font-variant-numeric:tabular-nums}
.dot{display:inline-block; width:.7em; height:.7em; border-radius:50%; background:var(--dc); margin-right:4px}
.yes{color:var(--ink); font-weight:700; margin-left:6px}
</style>
</head>
<body>
<main>

<section id="s-start" class="screen on">
  <h1 class="logo" aria-label="REAL FACE"><span class="w" aria-hidden="true"><i>REAL</i><b>REAL</b></span><span class="w" aria-hidden="true"><i>FACE</i><b>FACE</b></span><small aria-hidden="true">FIND THE REAL ONE</small></h1>
  <div class="stripe" aria-hidden="true"><i style="background:var(--o)"></i><i style="background:var(--y)"></i><i style="background:var(--b)"></i><i style="background:var(--g)"></i><i style="background:var(--p)"></i></div>
  <p class="tag">リアルピースの顔が、バラバラに！？<br>本人のパーツで、<b>リアルな顔</b>を取り戻せ！</p>

  <div class="vsel" id="vsel" role="radiogroup" aria-label="写真のバージョン"><button type="button" role="radio" data-v="normal">通常ver.</button><button type="button" role="radio" data-v="lovekoi">衣装ver.</button></div>
  <div class="sec"><h2>レベルを選ぶ</h2></div>
  <div class="levels">
    <button class="lvbtn" data-lv="easy"><span><b>簡単</b><small>本人＋2人、3人分のパーツから</small></span><span class="go" aria-hidden="true">▶︎</span></button>
    <button class="lvbtn" data-lv="hard"><span><b>難しい</b><small>5人全員のパーツから</small></span><span class="go" aria-hidden="true">▶︎</span></button>
    <button class="lvbtn" data-lv="rot"><span><b>激ムズ</b><small>5人全員・パーツの角度も合わせる</small></span><span class="go" aria-hidden="true">▶︎</span></button>
  </div>
</section>

<section id="s-member" class="screen">
  <div class="head">
    <button class="back" id="backBtn" aria-label="レベル選択に戻る">‹</button>
    <h2>どのメンバーにする？</h2>
  </div>
  <div class="subbar">
    <span class="lvtag" id="lvTag"></span>
    <button class="bestbtn" id="bestBtn" type="button">🏆 最高記録</button>
  </div>
  <div class="people" id="people"><p class="loading">画像を準備しています…</p></div>
</section>

<div class="modal" id="bestModal" role="dialog" aria-modal="true" aria-labelledby="bestTitle">
  <div class="card">
    <div class="mh"><h3 id="bestTitle">最高記録</h3><button class="x" id="bestClose" aria-label="閉じる">✕</button></div>
    <div class="bl-tabs" role="tablist" id="bestTabs"></div>
    <ul class="bl-list" id="bestList"></ul>
    <p class="bl-note">この端末・ブラウザでの記録です。</p>
  </div>
</div>

<section id="s-play" class="screen">
  <div class="hud">
    <div><div class="pill"><i></i><span id="playName"></span><span class="time" id="time">0:00</span></div><div class="need" id="playMsg"></div></div>
    <div class="acts">
      <button class="btn sm" id="quitBtn">やめる</button>
      <button class="btn sm primary" id="doneBtn" disabled>採点する</button>
    </div>
  </div>
  <div class="stagebox"><div id="stage"><canvas id="board" width="512" height="512"></canvas><div id="rotH" aria-hidden="true"><i></i><b>↻</b></div></div></div>
  <div class="tray">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="pal" id="pal"></div>
    <div class="tools">
      <button id="removeBtn" disabled>外す</button>
      <button id="clearBtn">全部外す</button>
      <button class="peek" id="peekBtn" type="button">押す間プレビュー</button>
    </div>
  </div>
</section>

<section id="s-result" class="screen">
  <div class="res">
    <div class="res-top">
      <div><div class="pill"><i></i><span id="resName"></span></div><div class="rank" id="rank"></div></div>
      <div class="score"><span class="big" id="total">0</span><span class="pt">点</span></div>
    </div>

<script>
/* 写真のバージョン。画像データは data/<名前>.js に分け、選んだときに読み込む（tools/assets.py で取り出し・書き戻し） */
// 画像データを作り直したら DATA_REV を変える（スマホに残った古いデータを使わせない）

const DATA = {}, DATA_WAIT = {};
function REALFACE_DATA(v, a){ DATA[v] = a; if (DATA_WAIT[v]) DATA_WAIT[v](); }
(() => {

  {k:'orange', n:'かずぅ',   c:'#F07A2A'},

const N = 512;
const $ = id => document.getElementById(id);
const IMG = {};   // key -> Image
let ready = false;
let target = null, pool = [], placed = [], tab = 'eye', sel = null, playing = false, scale = 1;
let timerId = null, t0 = 0, elapsed = 0, zTop = 5, seq = 0, lastRes = null;

const loadImg = src => new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = src; });
const getBest = (k, lv = level()) => { try { return parseFloat(localStorage.getItem('fw2-'+PAGE.id+'best-'+lv+'-'+k)) || 0 } catch(e){ return 0 } };
const setBest = (k,v) => { try { localStorage.setItem('fw2-'+PAGE.id+'best-'+level()+'-'+k, String(v)) } catch(e){} };

  {min:96, t:['本人そのもの','完全に本物','鏡を見てるみたい','本人より本人かも']},

/* メンバー本人の発言（Real Sound などのインタビュー記事で確認できたものだけ。出典は docs/spec/quotes.md）

const QUOTES = {

const GROUP_QUOTE = '僕たちが元気の押し売りアイドル、リアル！ リアル！ リアルピース！';
const QUOTE_RATE = 0.4;   // メンバーのセリフが出る確率
const pick = a => a[Math.floor(Math.random()*a.length)];
function rankText(total, n){ return pick(RANKS.find(r => total >= r.min).t).replace('{n}', n); }
function memberQuote(k, total){
  if (Math.random() >= QUOTE_RATE) return null;
  const band = total >= 82 ? 'hi' : total < 60 ? 'lo' : 'mid';
  const qs = QUOTES[k].filter(x => x.band === 'any' || x.band === band);
  if (band === 'hi' && Math.random() < .2) return {q:GROUP_QUOTE, by:'リアルピース', c:'var(--ink)'};

}
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id===id)); window.scrollTo(0,0); }
function toMembers(){ clearPieces(); renderPeople(); document.documentElement.style.removeProperty('--c'); show('s-member'); }
$('s-play').addEventListener('contextmenu', e => e.preventDefault());
document.querySelectorAll('.lvbtn').forEach(b => b.onclick = () => { curLv = b.dataset.lv; $('lvTag').textContent = LV[curLv] + (PAGE.ver !== 'normal' ? '・' + VERS[PAGE.ver].label : ''); toMembers(); });
$('backBtn').onclick = () => show('s-start');
$('vsel').querySelectorAll('button').forEach(b => b.onclick = () => loadVer(b.dataset.v));


// バージョンのデータ（data/<名前>.js）を読み込む。読み込み済みならそのまま使う
function fetchVer(v){
  if (DATA[v]) return Promise.resolve(DATA[v]);
  return new Promise((ok, ng) => {
    DATA_WAIT[v] = () => ok(DATA[v]);
    const s = document.createElement('script'); s.src = VERS[v].src; s.onerror = ng; document.head.appendChild(s);
  });
}
let loadToken = 0;
async function loadVer(v){
  if (!VERS[v]) v = 'normal';
  const my = ++loadToken;
  PAGE.ver = v; PAGE.id = VERS[v].id; ready = PAGE.ready = false;
  $('vsel').querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(b.dataset.v === v)));
  try { localStorage.setItem('fw2-ver', v); } catch(e){}
  try { const u = new URL(location.href); if (v === 'normal') u.searchParams.delete('v'); else u.searchParams.set('v', v); history.replaceState(null, '', u); } catch(e){}
  $('people').innerHTML = '<p class="loading">画像を準備しています…</p>';
  let A;
  try { A = await fetchVer(v); } catch(e){ if (my === loadToken) $('people').innerHTML = '<p class="loading">画像を読み込めませんでした。ページを再読み込みしてください。</p>'; return; }
  const imgs = {}, jobs = [];
  for (const p of PEOPLE){
    const a = A[p.k];
    jobs.push(loadImg(a.orig).then(i=>imgs[p.k+':orig']=i));
    jobs.push(loadImg(a.base).then(i=>imgs[p.k+':base']=i));
    for (const s of SLOTS) jobs.push(loadImg(a.parts[s.k].img).then(i=>imgs[p.k+':'+s.k]=i));
  }
  try { await Promise.all(jobs); } catch(e){ if (my === loadToken) $('people').innerHTML = '<p class="loading">画像を読み込めませんでした。ページを再読み込みしてください。</p>'; return; }
  if (my !== loadToken) return;            // 読み込み中に別のバージョンが選ばれた
  ASSETS = A; TILT = Object.fromEntries(Object.entries(A).map(([k,a]) => [k, a.tilt || 0]));
  for (const k in IMG) delete IMG[k]; Object.assign(IMG, imgs);
  ready = PAGE.ready = true; renderPeople();
}
function init(){
  let v = new URLSearchParams(location.search).get('v');
  if (!v) try { v = localStorage.getItem('fw2-ver'); } catch(e){}
  loadVer(VERS[v] ? v : 'normal');
}
function renderPeople(){
  if (!ready) return;
  $('people').innerHTML = PEOPLE.map(p => {
    return `<button class="who" style="--c:${p.c}" data-k="${p.k}"><img src="${ASSETS[p.k].orig}" alt=""><span><span class="nm">${p.n}</span></span><span class="go" aria-hidden="true">▶︎</span></button>`;
  }).join('');
  $('people').querySelectorAll('.who').forEach(b => b.onclick = () => { target = b.dataset.k; startPlay(); });
}
/* ---------- 最高記録（メンバー選択の上のボタンから開く。最初は選んだレベル） ---------- */
let bestLv = 'easy';
function renderBest(){
  $('bestTabs').innerHTML = Object.keys(LV).map(lv => `<button role="tab" aria-selected="${lv===bestLv}" data-lv="${lv}">${LV[lv]}</button>`).join('');
  $('bestTabs').querySelectorAll('button').forEach(b => b.onclick = () => { bestLv = b.dataset.lv; renderBest(); });
  $('bestList').innerHTML = PEOPLE.map(p => { const v = getBest(p.k, bestLv);
    return `<li style="--c:${p.c}"><img src="${ASSETS[p.k].orig}" alt=""><span class="n">${p.n}</span>${v ? `<span class="v">${v.toFixed(1)}<small>点</small></span>` : '<span class="none">なし</span>'}</li>`; }).join('');
}
function openBest(){ bestLv = level(); renderBest(); $('bestModal').classList.add('on'); $('bestClose').focus(); }
function closeBest(){ $('bestModal').classList.remove('on'); $('bestBtn').focus(); }
$('bestBtn').onclick = openBest;
$('bestClose').onclick = closeBest;
$('bestModal').addEventListener('click', e => { if (e.target === $('bestModal')) closeBest(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('bestModal').classList.contains('on')) closeBest(); });

/* ---------- play ---------- */
const stage = $('stage'), board = $('board'), bctx = board.getContext('2d');
function startPlay(){
  stopTimer(); clearPieces(); tab = 'eye'; sel = null;
  const others = shuffle(PEOPLE.map(p=>p.k).filter(k=>k!==target));
  const who = [target, ...others.slice(0, level()==='easy' ? 2 : 4)];
  pool = {};
  TYPES.forEach(t => { pool[t.t] = shuffle(who.flatMap(k => SLOTS.filter(s=>s.t===t.t).map(s => k+':'+s.k))); });
  bctx.drawImage(IMG[target+':base'], 0, 0, N, N);
  show('s-play'); layout(); renderTabs(); renderPal();
  $('time').textContent = '0:00';
  beginTimer();
}
function layout(){
  scale = stage.clientWidth / N;
  placed.forEach(placeEl);
}
new ResizeObserver(() => { if ($('s-play').classList.contains('on')) layout(); }).observe(stage);
function placeEl(p){
  const im = IMG[p.id];
  p.el.style.width = (im.naturalWidth*scale)+'px';
  p.el.style.left = ((p.cx - im.naturalWidth/2)*scale)+'px';
  p.el.style.top  = ((p.cy - im.naturalHeight/2)*scale)+'px';
  p.el.style.transform = p.rot ? `rotate(${p.rot}deg)` : '';
  if (p === sel) placeHandle();
}
/* ---------- 回転つまみ（激ムズ） ---------- */
const rotH = $('rotH'), knob = rotH.querySelector('b'), arm = rotH.querySelector('i');
let flipH = false;
function handleVec(p){
  // パーツの上（回転に合わせて回る）につまみを出す。ステージからはみ出すなら下側に出す
  const im = IMG[p.id], L = (Math.max(im.naturalWidth, im.naturalHeight)/2)*scale + 26, a = (p.rot||0)*Math.PI/180;
  let v = { x: Math.sin(a)*L, y: -Math.cos(a)*L };
  const cx = p.cx*scale, cy = p.cy*scale, W = stage.clientWidth, in_ = (x,y) => x>16 && y>16 && x<W-16 && y<W-16;
  flipH = !in_(cx+v.x, cy+v.y) && in_(cx-v.x, cy-v.y);
  if (flipH) v = { x:-v.x, y:-v.y };
  return v;
}
function placeHandle(){
  const p = sel, on = !!(p && rotLv() && playing);
  rotH.classList.toggle('on', on);
  if (!on) return;
  const v = handleVec(p);
  rotH.style.left = (p.cx*scale)+'px'; rotH.style.top = (p.cy*scale)+'px';
  knob.style.left = v.x+'px'; knob.style.top = v.y+'px';
  arm.style.width = Math.hypot(v.x, v.y)+'px'; arm.style.transform = `rotate(${Math.atan2(v.y, v.x)}rad)`;
}
knob.addEventListener('pointerdown', e => {
  if (!sel || !playing) return;
  e.preventDefault(); e.stopPropagation(); knob.setPointerCapture(e.pointerId);
  const p = sel, r = stage.getBoundingClientRect();
  const ang = ev => Math.atan2((ev.clientX-r.left)/scale - p.cx, -((ev.clientY-r.top)/scale - p.cy))*180/Math.PI + (flipH ? 180 : 0);
  const a0 = ang(e), r0 = p.rot || 0;
  const mv = ev => { let d = ang(ev) - a0; d = ((d+540)%360)-180; p.rot = Math.max(-90, Math.min(90, r0 + d)); placeEl(p); };
  const up = () => { knob.removeEventListener('pointermove', mv); knob.removeEventListener('pointerup', up); knob.removeEventListener('pointercancel', up); };
  knob.addEventListener('pointermove', mv); knob.addEventListener('pointerup', up); knob.addEventListener('pointercancel', up);
});
function renderTabs(){
  $('tabs').innerHTML = TYPES.map(t => {
    const c = placed.filter(p=>p.t===t.t).length;
    return `<button role="tab" aria-selected="${t.t===tab}" data-t="${t.t}">${t.n} <b>${c}/${t.max}</b></button>`;
  }).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.t; renderTabs(); renderPal(); });
}
function renderPal(){
  const tn = TM[tab].n;
  $('pal').innerHTML = pool[tab].map((id,i) => {
    const used = placed.some(q=>q.id===id), [k,part] = id.split(':');
    const lv = rotLv() ? ` class="lv" style="--r:${-TILT[k]}deg"` : '';
    return `<button class="${used?'used':''}" data-id="${id}" aria-label="${tn}${i+1}${used?'（使用中）':''}"><img src="${ASSETS[k].parts[part].img}"${lv} alt=""></button>`;
  }).join('');
  $('pal').querySelectorAll('button').forEach(b => b.onclick = () => addPiece(b.dataset.id));
}
function addPiece(id){
  if (!playing) return;
  const ex = placed.find(p=>p.id===id);
  if (ex){ select(ex); return; }
  const [owner, part] = id.split(':');
  const t = SLOTS.find(s=>s.k===part).t;
  const same = placed.filter(p=>p.t===t);
  // 上限なら、選択中の同じ種類のパーツと入れ替える（選択がなければ古いほう）
  let at = null;
  if (same.length >= TM[t].max){
    const old = sel && sel.t === t ? sel : same.sort((a,b)=>a.seq-b.seq)[0];
    // 入れ替えたパーツは同じ場所・同じ見た目の角度に置く
    at = { cx: old.cx, cy: old.cy, rot: (old.rot||0) + TILT[old.owner] - TILT[owner] };
    removePiece(old);
  }
  const el = document.createElement('img');
  el.src = IMG[id].src; el.className = 'piece'; el.alt = TM[t].n; el.draggable = false;
  el.style.zIndex = ++zTop;
  const p = { id, owner, part, t, seq:++seq, el,
    cx: at ? at.cx : 150 + Math.random()*212, cy: at ? at.cy : 150 + Math.random()*212,
    rot: !rotLv() ? 0 : at ? at.rot : -TILT[owner] };   // 激ムズは水平にそろえた向きで出す
  stage.appendChild(el);
  placed.push(p); placeEl(p); bindDrag(p); select(p);
  renderTabs(); renderPal(); status();
}
function removePiece(p){
  p.el.remove(); placed = placed.filter(q=>q!==p);
  if (sel === p) select(null);
}
function clearPieces(){ placed.forEach(p=>p.el.remove()); placed = []; sel = null; }
function select(p){
  sel = p; placed.forEach(q => q.el.classList.toggle('sel', q===p));
  placeHandle();
  $('removeBtn').disabled = !p || !playing;
}
$('removeBtn').onclick = () => { if (sel){ removePiece(sel); renderTabs(); renderPal(); status(); } };
$('clearBtn').onclick = () => { if (!playing) return; clearPieces(); select(null); renderTabs(); renderPal(); status(); };
function bindDrag(p){
  let off = null;
  p.el.addEventListener('pointerdown', e => {
    if (!playing) return;
    e.preventDefault(); p.el.setPointerCapture(e.pointerId);
    const r = stage.getBoundingClientRect();
    off = { x:(e.clientX-r.left)/scale - p.cx, y:(e.clientY-r.top)/scale - p.cy };
    p.el.style.zIndex = ++zTop; p.el.classList.add('drag'); select(p);
  });
  p.el.addEventListener('pointermove', e => {
    if (!off) return;
    const r = stage.getBoundingClientRect();
    p.cx = Math.max(0, Math.min(N, (e.clientX-r.left)/scale - off.x));
    p.cy = Math.max(0, Math.min(N, (e.clientY-r.top)/scale - off.y));
    placeEl(p);
  });
  const up = () => { off = null; p.el.classList.remove('drag'); };
  p.el.addEventListener('pointerup', up); p.el.addEventListener('pointercancel', up);
}
function complete(){ return TYPES.every(t => placed.filter(p=>p.t===t.t).length === t.max); }
function status(){
  const P = PM[target];
  const need = TYPES.map(t => t.max - placed.filter(p=>p.t===t.t).length).reduce((a,b)=>a+b,0);
  document.documentElement.style.setProperty('--c', P.c);
  $('playName').textContent = P.n;
  $('playMsg').textContent = need === 4 ? (rotLv() ? 'タップで乗せて、○で回転' : 'タップで乗せてドラッグ') : need ? `あと${need}パーツ・${LV[level()]}` : 'そろいました！';
  $('doneBtn').disabled = !complete() || !playing;
}
function beginTimer(){
  playing = true; t0 = performance.now(); status();
  timerId = setInterval(() => { elapsed = (performance.now()-t0)/1000; $('time').textContent = fmt(elapsed); }, 250);
}
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; playing = false; placeHandle(); }
$('quitBtn').onclick = () => { stopTimer(); toMembers(); };
$('doneBtn').onclick = finish;
(() => {
  const b = $('peekBtn');
  const on = e => { if (e) e.preventDefault(); stage.classList.add('peek'); b.classList.add('on'); };
  const off = () => { stage.classList.remove('peek'); b.classList.remove('on'); };
  b.addEventListener('pointerdown', e => { b.setPointerCapture && b.setPointerCapture(e.pointerId); on(e); });
  ['pointerup','pointercancel','lostpointercapture','blur'].forEach(t => b.addEventListener(t, off));
  b.addEventListener('contextmenu', e => e.preventDefault());
  b.addEventListener('keydown', e => { if (e.key===' '||e.key==='Enter') on(e); });
  b.addEventListener('keyup', e => { if (e.key===' '||e.key==='Enter') off(); });
})();

/* ---------- scoring ---------- */
function composite(at){
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d'); x.drawImage(IMG[target+':base'], 0, 0, N, N);
  [...placed].sort((a,b)=>(+a.el.style.zIndex)-(+b.el.style.zIndex)).forEach(p => {
    const im = IMG[p.id], q = at ? at.get(p) : p;
    x.save(); x.translate(q.cx, q.cy); x.rotate((q.rot||0)*Math.PI/180);
    x.drawImage(im, -im.naturalWidth/2, -im.naturalHeight/2); x.restore();
  });
  return c;
}
function idealComposite(){
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d'); x.drawImage(IMG[target+':base'], 0, 0, N, N);
  const parts = ASSETS[target].parts;
  SLOTS.forEach(s => { const im = IMG[target+':'+s.k]; x.drawImage(im, parts[s.k].cx - im.naturalWidth/2, parts[s.k].cy - im.naturalHeight/2); });
  return c;
}
// 完成画像と理想画像の違い（のっぺらぼうとの違いを1とした比）
function lookDiff(comp){
  const parts = ASSETS[target].parts;
  let x0=N,y0=N,x1=0,y1=0;
  SLOTS.forEach(s => { const r = parts[s.k]; x0=Math.min(x0,r.x); y0=Math.min(y0,r.y); x1=Math.max(x1,r.x+r.w); y1=Math.max(y1,r.y+r.h); });
  x0=Math.max(0,x0-16); y0=Math.max(0,y0-16); x1=Math.min(N,x1+16); y1=Math.min(N,y1+16);
  const w = x1-x0, h = y1-y0, sw = Math.max(6,Math.round(w/10)), sh = Math.max(6,Math.round(h/10));
  const small = src => { const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(src, x0, y0, w, h, 0, 0, sw, sh);
    return x.getImageData(0,0,sw,sh).data; };
  const bc = document.createElement('canvas'); bc.width = N; bc.height = N; bc.getContext('2d').drawImage(IMG[target+':base'],0,0,N,N);
  const o = small(idealComposite()), b = small(bc), m = small(comp);
  let db = 0, dm = 0;
  for (let i=0;i<o.length;i+=4) for (let k=0;k<3;k++){ db += Math.abs(o[i+k]-b[i+k]); dm += Math.abs(o[i+k]-m[i+k]); }
  return dm/Math.max(1,db);   // 0=本人の顔と同じ、1=のっぺらぼうと同じだけ違う
}
function finish(){
  if (!complete()) return;
  elapsed = (performance.now()-t0)/1000; stopTimer(); select(null);
  const parts = ASSETS[target].parts;
  const S = Math.hypot(parts.eyeR.cx-parts.eyeL.cx, parts.eyeR.cy-parts.eyeL.cy);
  const d = (p,s) => Math.hypot(p.cx-parts[s].cx, p.cy-parts[s].cy);
  const eyes = placed.filter(p=>p.t==='eye');
  const [a,b] = (d(eyes[0],'eyeR')+d(eyes[1],'eyeL') <= d(eyes[1],'eyeR')+d(eyes[0],'eyeL')) ? eyes : [eyes[1],eyes[0]];
  const match = { eyeR:a, eyeL:b, nose:placed.find(p=>p.t==='nose'), mouth:placed.find(p=>p.t==='mouth') };
  const res = SLOTS.map(s => {
    const p = match[s.k], err = d(p, s.k)/S;
    // 激ムズは角度のずれも位置の点に入れる（25度ずれで約37%）
    const rerr = rotLv() ? Math.abs((p.rot||0) - idealRot(p)) : 0;
    return { s, p, score: 100*Math.exp(-((err/0.35)**2) - ((rerr/25)**2)), own: p.owner===target };
  });
  const pos = res.reduce((t,r)=>t+r.score,0)/res.length;
  const comp = composite();
  // 見た目：「正しいパーツを選べたか」（各パーツを正解の位置に置き直して比べる）を6割、
  // 「置いた位置での見た目」を4割。少しずれた本人パーツが、のっぺらぼうより悪い扱いにならないように（2026-10-08）
  const at = new Map(res.map(r => [r.p, { cx: parts[r.s.k].cx, cy: parts[r.s.k].cy, rot: idealRot(r.p) }]));
  const look = .6*lookDiff(composite(at)) + .4*lookDiff(comp);
  const sim = 100*Math.exp(-((look/0.6)**2));
  const total = (pos + sim)/2;
  lastRes = { res, comp };

  $('total').textContent = total.toFixed(1);
  $('posScore').textContent = pos.toFixed(1);
  $('simScore').textContent = sim.toFixed(1);
  $('rank').textContent = rankText(total, PM[target].n);
  const mq = memberQuote(target, total), qe = $('resQuote');
  qe.hidden = !mq;
  if (mq){ qe.style.setProperty('--qc', mq.c); qe.innerHTML = `「${mq.q}」<small>— ${mq.by}</small>`; }
  $('resName').textContent = PM[target].n;
  $('timeScore').textContent = fmt(elapsed);
  const own = res.filter(r=>r.own).length;
  const best = getBest(target);
  let bl = '';
  if (total > best){ setBest(target,total); bl = best ? `最高点を更新（前回 ${best.toFixed(1)}）` : ''; }
  else bl = `最高 ${best.toFixed(1)}点`;
  $('resMeta').innerHTML = `本人のパーツ ${own}/4・${LV[level()]}` + (bl ? `　<span class="best">${bl}</span>` : '');
  $('bars').innerHTML = res.map(r => `<li><span><span class="dot sd" style="--dc:${PM[r.p.owner].c}"></span>${r.s.n.replace('向かって','')}${r.own ? '<span class="sd">✓</span>' : ''}</span><span class="bar"><i style="width:${r.score.toFixed(1)}%"></i></span><span class="v">${Math.round(r.score)}</span>
    <span class="who2"><span class="dot" style="--dc:${PM[r.p.owner].c}"></span>${PM[r.p.owner].n}の${SLOTS.find(s=>s.k===r.p.part).n.replace(/（.*）/,'')}${r.own ? '<span class="yes">本人のパーツ</span>' : ''}</span></li>`).join('');
  document.querySelector('input[name=view][value=answer]').checked = true;
  renderResult('answer'); show('s-result');
}
function renderResult(view){
  const c = document.createElement('canvas'); c.width = N; c.height = N;
  const x = c.getContext('2d');
  if (view === 'orig') x.drawImage(IMG[target+':orig'],0,0,N,N);
  else {
    x.drawImage(lastRes.comp, 0, 0);
    if (view === 'answer'){
      const parts = ASSETS[target].parts, lw = 2.5;
      lastRes.res.forEach(({s,p}) => {
        const r = parts[s.k], iw = r.w*.72, ih = r.h*.6;
        const col = PM[target].c;
        x.setLineDash([6,5]); x.lineWidth = lw; x.strokeStyle = '#FFFFFF';
        x.beginPath(); x.ellipse(r.cx, r.cy, r.w*.42, r.h*.42, 0, 0, Math.PI*2); x.stroke();
        x.setLineDash([]); x.strokeStyle = col; x.lineWidth = lw*1.4;
        x.beginPath(); x.moveTo(r.cx,r.cy); x.lineTo(p.cx,p.cy); x.stroke();
        x.fillStyle = '#FFFFFF'; x.beginPath(); x.arc(r.cx,r.cy,4,0,Math.PI*2); x.fill();
        x.fillStyle = col; x.beginPath(); x.arc(p.cx,p.cy,5,0,Math.PI*2); x.fill();
      });
    }
  }
  $('resCap').hidden = view !== 'answer';
  $('resultImg').src = c.toDataURL('image/jpeg', .9);
}
document.querySelectorAll('input[name=view]').forEach(r => r.addEventListener('change', e => renderResult(e.target.value)));
$('againBtn').onclick = startPlay;
$('homeBtn').onclick = toMembers;
init();
})();
</script>
